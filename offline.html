<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — ታግ ብሪጅ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
        .card { max-width: 420px; }
        .icon { font-size: 4rem; margin-bottom: 24px; }
        h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 12px; }
        p { color: #8b949e; line-height: 1.6; margin-bottom: 24px; }
        a { display: inline-block; padding: 12px 28px; border-radius: 50px; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📡</div>
        <h1>ኢንተርኔት የለም</h1>
        <p>ታግ ብሪጅ ለመጠቀም ኢንተርኔት ግንኙነት ያስፈልጋል። ግንኙነትዎን ያረጋግጡ።<br><br>You need an internet connection to use Tag Bridge.</p>
        <a href="/">🔄 Try Again</a>
    </div>
</body>
</html>
