<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ወደ WhatsApp በመሄድ ላይ...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #25d366, #128c7e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            padding: 20px;
        }
        .card {
            background: rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 400px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
        }
        .wa-icon { font-size: 5rem; margin-bottom: 20px; }
        h1 { font-size: 1.5rem; margin-bottom: 10px; font-weight: 800; }
        p { font-size: 1rem; opacity: 0.9; margin-bottom: 25px; line-height: 1.6; }
        .btn {
            display: inline-block;
            background: white;
            color: #25d366;
            padding: 15px 35px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 800;
            text-decoration: none;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            margin: 8px;
        }
        .btn-outline {
            background: transparent;
            color: white;
            border: 2px solid white;
        }
        .note {
            margin-top: 20px;
            font-size: 0.85rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="wa-icon">💬</div>
        <h1>ወደ WhatsApp ለመሄድ</h1>
        <p>TikTok ቀጥታ ወደ WhatsApp ማስተላለፍ ስለሚከለክል፣ ከዚህ በታች ያለውን ቁልፍ ይጫኑ።</p>
        <a href="#" id="waBtn" class="btn">📱 WhatsApp ክፈት</a>
        <br>
        <a href="/" class="btn btn-outline">← ወደ ድረ-ገጽ ተመለስ</a>
        <p class="note">If WhatsApp doesn't open, copy the number: +251991856292</p>
    </div>

    <script>
        // Get message from URL parameter
        var params = new URLSearchParams(window.location.search);
        var msg = params.get('msg') || 'ሰላም ታግ ብሪጅ !ተጨማሪ ማብራሪያዎችን እፈልጋለሁ።';
        var encoded = encodeURIComponent(msg);
        var waUrl = 'https://wa.me/251991856292?text=' + encoded;

        document.getElementById('waBtn').href = waUrl;

        // Auto-redirect after 1 second if not in TikTok
        var ua = navigator.userAgent || '';
        var isTikTok = /TikTok|BytedanceWebview|musical_ly/i.test(ua);

        if (!isTikTok) {
            setTimeout(function() {
                window.location.href = waUrl;
            }, 800);
        }
    </script>
</body>
</html>
