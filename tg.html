<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ወደ Telegram በመሄድ ላይ...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0088cc, #00a0e9);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            padding: 20px;
        }
        .card {
            background: rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 400px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
        }
        .tg-icon { font-size: 5rem; margin-bottom: 20px; }
        h1 { font-size: 1.5rem; margin-bottom: 10px; font-weight: 800; }
        p { font-size: 1rem; opacity: 0.9; margin-bottom: 25px; line-height: 1.6; }
        .btn {
            display: inline-block;
            background: white;
            color: #0088cc;
            padding: 15px 35px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 800;
            text-decoration: none;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            margin: 8px;
        }
        .btn-outline {
            background: transparent;
            color: white;
            border: 2px solid white;
        }
        .note {
            margin-top: 20px;
            font-size: 0.85rem;
            opacity: 0.7;
        }
        .step {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 12px;
            font-size: 0.9rem;
            text-align: left;
        }
        .step strong { display: block; margin-bottom: 4px; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="tg-icon">✈️</div>
        <h1>ወደ Telegram ለመሄድ</h1>
        <p>TikTok browser ቀጥታ ወደ Telegram ማስተላለፍ ስለሚከለክል፣ ከዚህ በታች ያለውን ቁልፍ ይጫኑ።</p>

        <div class="step">
            <strong>📋 መልእክቱ ተዘጋጅቷል</strong>
            ቁልፉን ከጫኑ በኋላ Telegram ይከፈትና መልእክቱ ዝግጁ ሆኖ ያገኙታል።
        </div>

        <a href="#" id="tgBtn" class="btn">✈️ Telegram ክፈት</a>
        <br>
        <a href="/" class="btn btn-outline">← ወደ ድረ-ገጽ ተመለስ</a>
        <p class="note">Telegram ካልተከፈተ፦ @tagbridge123 ይፈልጉ</p>
    </div>

    <script>
        var params = new URLSearchParams(window.location.search);
        var msg = params.get('msg') || 'ሰላም ታግ ብሪጅ! ተጨማሪ ማብራሪያ እፈልጋለሁ።';
        var encoded = encodeURIComponent(msg);
        var tgUrl = 'https://t.me/tagbridge123?text=' + encoded;

        document.getElementById('tgBtn').href = tgUrl;

        // Auto-redirect if not in a restricted in-app browser
        var ua = navigator.userAgent || '';
        var isRestricted = /TikTok|BytedanceWebview|musical_ly|Instagram|FBAN|FBAV/i.test(ua);

        if (!isRestricted) {
            setTimeout(function() {
                window.location.href = tgUrl;
            }, 800);
        }
    </script>
</body>
</html>
