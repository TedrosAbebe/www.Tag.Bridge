<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram ለመክፈት</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0088cc, #00a0e9);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            padding: 20px;
        }
        .card {
            background: rgba(255,255,255,0.15);
            border-radius: 24px;
            padding: 36px 28px;
            max-width: 380px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .icon { font-size: 4rem; margin-bottom: 16px; }
        h1 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
        .sub { font-size: 0.9rem; opacity: 0.85; margin-bottom: 28px; line-height: 1.6; }

        /* Step box */
        .steps { text-align: left; margin-bottom: 24px; }
        .step {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            background: rgba(255,255,255,0.15);
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 12px;
        }
        .num {
            background: white;
            color: #0088cc;
            font-weight: 900;
            font-size: 1rem;
            width: 30px; height: 30px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .step-text { font-size: 0.92rem; line-height: 1.5; padding-top: 4px; }
        .step-text strong { display: block; font-size: 1rem; margin-bottom: 2px; }

        /* Arrow pointing to top-right */
        .arrow-hint {
            position: fixed;
            top: 14px; right: 14px;
            font-size: 2.8rem;
            animation: bounce 1s ease-in-out infinite;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .dots-img {
            background: white;
            color: #0088cc;
            border-radius: 10px;
            padding: 4px 10px;
            font-weight: 900;
            font-size: 1.1rem;
            display: inline-block;
            margin: 0 2px;
            vertical-align: middle;
        }

        .btn-back {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            text-decoration: none;
            border: 2px solid rgba(255,255,255,0.5);
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <!-- Arrow pointing to the ••• button top-right -->
    <div class="arrow-hint">☝️</div>

    <div class="card">
        <div class="icon">✈️</div>
        <h1>Telegram ለመክፈት</h1>
        <p class="sub">TikTok ቀጥታ ወደ Telegram ሊልክ አይችልም። ከዚህ በታች ያሉትን ደረጃዎች ይከተሉ።</p>

        <div class="steps">
            <div class="step">
                <div class="num">1</div>
                <div class="step-text">
                    <strong>⋯ ሶስት ነጥቦቹን ጫኑ</strong>
                    ከላይ በቀኝ ጥግ ያለውን <span class="dots-img">•••</span> ቁልፍ ይጫኑ
                </div>
            </div>
            <div class="step">
                <div class="num">2</div>
                <div class="step-text">
                    <strong>🌐 "Open in browser" ይምረጡ</strong>
                    ከሚወጣው ምናሌ "Open in browser" የሚለውን ይጫኑ
                </div>
            </div>
            <div class="step">
                <div class="num">3</div>
                <div class="step-text">
                    <strong>✈️ Telegram ይከፈታል</strong>
                    Browser ውስጥ ሲከፈት ቁልፉን ጫኑ — Telegram ይከፈትና ትዕዛዙ ዝግጁ ይሆናል
                </div>
            </div>
        </div>

        <a href="/" class="btn-back">← ወደ ድረ-ገጽ ተመለስ</a>
    </div>

    <script>
        var params = new URLSearchParams(window.location.search);
        var msg = params.get('msg') || 'ሰላም ታግ ብሪጅ! ተጨማሪ ማብራሪያ እፈልጋለሁ።';
        var tgUrl = 'https://t.me/tagbridge123?text=' + msg;

        // Store for use when user clicks after opening in browser
        window._tgUrl = tgUrl;

        // If opened in a real browser (not TikTok), auto-redirect to Telegram immediately
        var ua = navigator.userAgent || '';
        var isRestricted = /TikTok|BytedanceWebview|musical_ly|Instagram|FBAN|FBAV/i.test(ua);
        if (!isRestricted) {
            window.location.replace(tgUrl);
        }
    </script>
</body>
</html>
