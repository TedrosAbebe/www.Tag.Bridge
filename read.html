<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📖 Tag Bridge — መጽሃፍ ንባብ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0d0d1a;
            --bg2: #13131f;
            --surface: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.08);
            --accent: #5b7de8;
            --green: #38ef7d;
            --gold: #ffd200;
            --text: rgba(255,255,255,0.9);
            --muted: rgba(255,255,255,0.4);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        /* Ambient background glow */
        body::before {
            content: '';
            position: fixed;
            top: -40%; left: -20%;
            width: 80%; height: 80%;
            background: radial-gradient(ellipse, rgba(91,125,232,0.12) 0%, transparent 65%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -30%; right: -10%;
            width: 60%; height: 60%;
            background: radial-gradient(ellipse, rgba(56,239,125,0.07) 0%, transparent 65%);
            pointer-events: none;
            z-index: 0;
        }

        /* ===== PASSWORD SCREEN ===== */
        #passwordScreen {
            position: relative;
            z-index: 1;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 28px;
            padding: 44px 36px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 32px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
            animation: cardIn 0.5s cubic-bezier(0.175,0.885,0.32,1.275);
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .lock-wrap {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, rgba(91,125,232,0.2), rgba(56,239,125,0.1));
            border: 1px solid rgba(91,125,232,0.3);
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            animation: lockFloat 3s ease-in-out infinite;
        }

        @keyframes lockFloat {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .lock-wrap i {
            font-size: 1.8rem;
            background: linear-gradient(135deg, var(--accent), var(--green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .screen-title {
            font-size: 1.4rem;
            font-weight: 900;
            color: white;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .screen-subtitle {
            font-size: 0.82rem;
            color: var(--muted);
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .input-wrap {
            position: relative;
            margin-bottom: 14px;
        }

        .input-icon {
            position: absolute;
            left: 16px; top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 0.9rem;
        }

        .password-input {
            width: 100%;
            padding: 14px 18px 14px 42px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            outline: none;
            transition: all 0.25s;
            text-align: center;
        }

        .password-input:focus {
            border-color: rgba(91,125,232,0.5);
            background: rgba(91,125,232,0.08);
            box-shadow: 0 0 0 3px rgba(91,125,232,0.12);
        }

        .password-input::placeholder {
            color: var(--muted);
            letter-spacing: 1px;
            text-transform: none;
            font-weight: 500;
        }

        .btn-open {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            background: linear-gradient(135deg, #5b7de8, #3a4fc4);
            color: white;
            border: none;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 6px 24px rgba(91,125,232,0.35);
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
        }

        .btn-open::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }

        .btn-open:hover::before { left: 100%; }
        .btn-open:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(91,125,232,0.45); }
        .btn-open:active { transform: scale(0.98); }
        .btn-open:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .status-msg {
            display: none;
            margin-top: 12px;
            padding: 11px 16px;
            border-radius: 12px;
            font-size: 0.83rem;
            font-weight: 600;
            line-height: 1.5;
        }

        .status-msg.error {
            background: rgba(255,80,80,0.1);
            border: 1px solid rgba(255,80,80,0.25);
            color: #ff8080;
        }

        .status-msg.loading {
            background: rgba(91,125,232,0.1);
            border: 1px solid rgba(91,125,232,0.2);
            color: rgba(255,255,255,0.6);
        }

        .status-msg.device {
            background: rgba(255,165,0,0.1);
            border: 1px solid rgba(255,165,0,0.25);
            color: #ffb347;
        }

        .status-msg .spin { animation: spin 1s linear infinite; display: inline-block; margin-right: 6px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: var(--muted);
            font-size: 0.78rem;
            text-decoration: none;
            transition: color 0.2s;
            padding: 4px 8px;
            border-radius: 8px;
        }

        .back-link:hover { color: rgba(255,255,255,0.65); background: var(--surface); }

        /* ===== VIEWER SCREEN ===== */
        #viewerScreen {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg);
            flex-direction: column;
            z-index: 1000;
        }

        #viewerScreen.active { display: flex; }

        /* Top bar */
        .viewer-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            height: 56px;
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            gap: 12px;
        }

        .viewer-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .viewer-logo-icon {
            width: 30px; height: 30px;
            background: linear-gradient(135deg, var(--accent), #3a4fc4);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem;
            color: white;
        }

        .viewer-logo-text {
            font-size: 0.82rem;
            font-weight: 800;
            color: white;
            letter-spacing: -0.3px;
        }

        .viewer-logo-text .t { color: var(--green); }
        .viewer-logo-text .b { color: var(--gold); }

        .viewer-book-title {
            flex: 1;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 700;
            color: rgba(255,255,255,0.6);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .viewer-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-close-viewer {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,80,80,0.12);
            border: 1px solid rgba(255,80,80,0.2);
            color: #ff8080;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }

        .btn-close-viewer:hover {
            background: rgba(255,80,80,0.2);
            color: #ff6060;
        }

        /* PDF iframe */
        #pdfFrame {
            flex: 1;
            width: 100%;
            border: none;
            background: #1a1a1a;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Bottom bar */
        .viewer-footer {
            height: 36px;
            background: var(--bg2);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .viewer-footer-text {
            font-size: 0.68rem;
            color: var(--muted);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .viewer-footer-text span { color: var(--green); }

        /* Mobile */
        @media (max-width: 480px) {
            #passwordScreen { padding: 32px 24px; border-radius: 22px; }
            .screen-title { font-size: 1.2rem; }
            .viewer-bar { height: 50px; padding: 0 12px; }
        }
    </style>
</head>
<body>

    <!-- PASSWORD SCREEN -->
    <div id="passwordScreen">
        <div class="lock-wrap">
            <i class="fas fa-book-open"></i>
        </div>
        <div class="screen-title">መጽሃፍ ክፈት</div>
        <div class="screen-subtitle">
            የተላከልዎትን password ያስገቡ
            <br><small>Enter your book access password</small>
        </div>

        <div class="input-wrap">
            <i class="fas fa-key input-icon"></i>
            <input type="text" id="passwordInput" class="password-input"
                placeholder="Password ያስገቡ" maxlength="20"
                oninput="this.value=this.value.toUpperCase()" autocomplete="off">
        </div>

        <button class="btn-open" id="openBtn" onclick="checkPassword()">
            <i class="fas fa-unlock-alt"></i> &nbsp; ክፈት
        </button>

        <div class="status-msg" id="statusMsg"></div>

        <a href="/" class="back-link">
            <i class="fas fa-arrow-left" style="font-size:0.7rem; margin-right:4px;"></i>
            ወደ ዌብሳይቱ ተመለሱ
        </a>
    </div>

    <!-- VIEWER SCREEN -->
    <div id="viewerScreen">
        <!-- Top bar -->
        <div class="viewer-bar">
            <div class="viewer-logo">
                <div class="viewer-logo-icon"><i class="fas fa-book-open"></i></div>
                <div class="viewer-logo-text"><span class="t">ታግ</span> <span class="b">ብሪጅ</span></div>
            </div>
            <div class="viewer-book-title" id="viewerTitle">—</div>
            <div class="viewer-actions">
                <button class="btn-close-viewer" onclick="closeViewer()">
                    <i class="fas fa-times"></i> ዝጋ
                </button>
            </div>
        </div>

        <!-- PDF -->
        <iframe id="pdfFrame" src="" allowfullscreen
            sandbox="allow-scripts allow-same-origin"></iframe>

        <!-- Bottom bar -->
        <div class="viewer-footer">
            <div class="viewer-footer-text">
                🔒 Protected by <span>Tag Bridge</span> — ለግል አጠቃቀም ብቻ
            </div>
        </div>
    </div>

    <script>
        var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxUsDWtmGOgG6ZyUNklXPagVIa_vq4WVe1awZtLVOTDztcQccpOkNW_07mTWcoOfi7g0g/exec';

        var PDF_LINKS = {
            'forex':  'https://drive.google.com/file/d/1r3UEZCWXOOPogC672VqEKMaaJR1Fo_XN/preview#toolbar=0&navpanes=0&scrollbar=0',
            'crypto': '',
            'bundle': ''
        };

        var BOOK_TITLES = {
            'forex':  'የፎሬክስ ትሬዲንግ መማሪያ መጽሃፍ',
            'crypto': 'የክሪፕቶ ትሬዲንግ መማሪያ መጽሃፍ',
            'bundle': 'ፎሬክስ + ክሪፕቶ ጥቅል'
        };

        // Device fingerprint
        function getDeviceId() {
            var id = localStorage.getItem('tb_device_id');
            if (!id) {
                id = 'dev_' + Date.now() + '_' + Math.random().toString(36).substring(2, 10);
                localStorage.setItem('tb_device_id', id);
            }
            return id;
        }

        function showStatus(type, msg) {
            var el = document.getElementById('statusMsg');
            el.className = 'status-msg ' + type;
            el.innerHTML = msg;
            el.style.display = 'block';
        }

        function hideStatus() {
            document.getElementById('statusMsg').style.display = 'none';
        }

        function checkPassword() {
            var password = document.getElementById('passwordInput').value.trim();
            if (!password || password.length < 3) {
                showStatus('error', '❌ እባክዎ password ያስገቡ');
                return;
            }

            var deviceId = getDeviceId();
            document.getElementById('openBtn').disabled = true;
            showStatus('loading', '<i class="fas fa-spinner spin"></i> እያረጋገጠ ነው...');

            var url = SCRIPT_URL + '?action=verify&password=' + encodeURIComponent(password) + '&device_id=' + encodeURIComponent(deviceId);

            fetch(url)
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    document.getElementById('openBtn').disabled = false;
                    hideStatus();
                    if (data.success) {
                        openPDF(data.book);
                    } else if (data.reason === 'different_device') {
                        showStatus('device',
                            '⚠️ ይህ password ሌላ device ላይ ጥቅም ላይ ውሏል።<br>' +
                            'ለማፅደቅ ታግ ብሪጅን ያናግሩ — ' +
                            '<a href="https://t.me/tagbridge123" target="_blank" style="color:#38ef7d; font-weight:800;">@tagbridge123</a>'
                        );
                    } else if (data.reason === 'expired') {
                        showStatus('error', '❌ Password ጊዜው አልፏል። ታግ ብሪጅን ያናግሩ።');
                    } else {
                        showStatus('error', '❌ Password ትክክለኛ አይደለም። እንደገና ይሞክሩ።');
                    }
                })
                .catch(function() {
                    document.getElementById('openBtn').disabled = false;
                    showStatus('error', '❌ Connection error. እንደገና ይሞክሩ።');
                });
        }

        function openPDF(book) {
            var link = PDF_LINKS[book] || PDF_LINKS['forex'];
            if (!link) {
                showStatus('error', 'PDF አልተዘጋጀም። ታግ ብሪጅን ያናግሩ — <a href="https://t.me/tagbridge123" target="_blank" style="color:#38ef7d;">@tagbridge123</a>');
                return;
            }
            var titleEl = document.getElementById('viewerTitle');
            if (titleEl) titleEl.textContent = BOOK_TITLES[book] || BOOK_TITLES['forex'];
            document.getElementById('pdfFrame').src = link;
            document.getElementById('viewerScreen').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeViewer() {
            document.getElementById('viewerScreen').classList.remove('active');
            document.getElementById('pdfFrame').src = '';
            document.body.style.overflow = '';
        }

        // Block right-click
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });

        // Enter key
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPassword();
        });
    </script>
</body>
</html>
